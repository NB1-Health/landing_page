# Include this file inside the HTTPS server block for stg.nb1.com.
# deploy-stg.sh writes the referenced password file from server-only .env.stg values.
#
# One path is exempt: the CMS MCP endpoint. MCP clients authenticate with their
# own key as `Authorization: Bearer …`, and a request has only one Authorization
# header, so behind Basic Auth no MCP client could ever reach staging. The
# endpoint is not public without it: Payload rejects any request without an
# enabled, unexpired MCP key, and check-staging-containment.mjs asserts that.
# Exact path only; everything else under /cms stays behind Basic Auth.
set $stg_basic_auth "NB1 Staging";
if ($uri ~ ^/cms/api/mcp/?$) {
  set $stg_basic_auth off;
}
auth_basic $stg_basic_auth;
auth_basic_user_file /var/www/landing_page/.htpasswd-staging;
