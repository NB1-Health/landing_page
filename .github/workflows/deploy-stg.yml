name: Sync Main to STG & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Only one staging deploy at a time. A new push to main WAITS for the running deploy to finish
# (queued, not cancelled) so two runs never execute `rm -rf node_modules && npm install` on the
# server at once — the race that floods the log with `npm warn tar TAR_ENTRY_ERROR ENOENT`.
# cancel-in-progress is deliberately false: cancelling the GitHub run would NOT kill the remote SSH
# `npm install`, leaving an orphaned install to race the next one (making the corruption worse).
concurrency:
  group: deploy-stg
  cancel-in-progress: false

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync stg to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin
          # stg is a deploy mirror of main. Reset it to main (instead of merging)
          # so a stale/diverged stg or a doc conflict can never silently block the
          # sync again — the old `git merge ... || true` swallowed the README
          # conflict and left stg frozen while the workflow still went green.
          git checkout -B stg origin/main
          git push origin stg --force

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STG_HOST }}
          username: ${{ secrets.STG_USER }}
          key: ${{ secrets.STG_SSH_KEY }}
          script: |
            set -e
            cd /var/www/landing_page
            git fetch origin stg
            git reset --hard origin/stg
            bash deploy-stg.sh

      - name: Verify staging containment at the edge
        env:
          STG_BASIC_AUTH_USERNAME: ${{ secrets.STG_BASIC_AUTH_USERNAME }}
          STG_BASIC_AUTH_PASSWORD: ${{ secrets.STG_BASIC_AUTH_PASSWORD }}
        run: node scripts/check-staging-containment.mjs

      - name: Verify staging international SEO
        env:
          SEO_DEPLOY_ENV: staging
          SEO_BASE_URL: https://stg.nb1.com
          STG_BASIC_AUTH_USERNAME: ${{ secrets.STG_BASIC_AUTH_USERNAME }}
          STG_BASIC_AUTH_PASSWORD: ${{ secrets.STG_BASIC_AUTH_PASSWORD }}
        run: npm run seo:check
